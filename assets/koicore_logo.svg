  <g transform="rotate(180 256 256)" filter="url(#soft-shadow)">
    <path d="M 363.73 136.35 C 370.19 135.39, 370.67 116.80, 365.33 105.52 C 359.98 94.25, 346.44 76.45, 331.67 68.71 C 316.90 60.97, 281.13 56.39, 276.70 59.08 C 272.26 61.78, 296.75 76.19, 305.06 84.90 C 313.38 93.60, 316.80 102.72, 326.58 111.29 C 336.36 119.87, 357.27 137.32, 363.73 136.35 Z" fill="url(#koi-pearl-fin)"/>
    <path d="M 332.95 170.54 C 333.88 174.97, 319.88 177.38, 312.43 178.33 C 304.97 179.29, 295.49 178.50, 288.22 176.26 C 280.95 174.02, 268.82 168.09, 268.80 164.90 C 268.79 161.70, 281.80 159.28, 288.14 157.09 C 294.48 154.90, 299.38 149.50, 306.85 151.74 C 314.32 153.98, 332.02 166.11, 332.95 170.54 Z" fill="url(#koi-pearl-fin)"/>
    <path d="M 375.51 187.00 C 378.73 184.91, 381.24 180.00, 381.87 174.26 C 382.49 168.53, 382.85 161.19, 379.24 152.59 C 375.63 143.98, 370.16 131.58, 360.20 122.63 C 350.24 113.67, 334.94 104.01, 319.49 98.87 C 304.03 93.72, 284.37 90.85, 267.49 91.75 C 250.60 92.64, 233.08 97.66, 218.16 104.23 C 203.24 110.80, 189.01 121.46, 177.99 131.15 C 166.96 140.84, 159.19 155.17, 152.01 162.37 C 144.84 169.57, 143.63 168.22, 134.96 174.36 C 126.29 180.50, 109.15 186.64, 100.01 199.22 C 90.87 211.81, 79.06 244.79, 80.11 249.86 C 81.16 254.92, 98.32 237.20, 106.31 229.61 C 114.30 222.01, 122.91 202.69, 128.05 204.30 C 133.19 205.92, 133.33 238.11, 137.17 239.30 C 141.00 240.49, 148.46 220.72, 151.06 211.46 C 153.67 202.20, 151.09 190.53, 152.79 183.73 C 154.48 176.93, 155.05 176.27, 161.23 170.67 C 167.41 165.07, 179.00 155.72, 189.86 150.15 C 200.72 144.58, 213.97 139.47, 226.39 137.22 C 238.80 134.97, 252.14 134.84, 264.35 136.64 C 276.55 138.43, 289.30 143.12, 299.63 148.01 C 309.96 152.90, 318.43 160.71, 326.34 165.97 C 334.25 171.23, 341.03 176.11, 347.07 179.58 C 353.11 183.05, 357.84 185.55, 362.58 186.79 C 367.32 188.02, 372.30 189.09, 375.51 187.00 Z" fill="url(#koi-pearl)"/>
    <path d="M 365.99 156.97 C 363.93 150.53, 356.01 137.43, 347.11 130.60 C 338.20 123.77, 318.67 115.50, 312.57 116.00 C 306.46 116.49, 306.80 127.06, 310.50 133.58 C 314.21 140.11, 326.65 149.19, 334.80 155.13 C 342.96 161.07, 354.22 168.92, 359.42 169.22 C 364.61 169.53, 368.04 163.41, 365.99 156.97 Z" fill="#F04E23" fill-opacity="0.85"/>
