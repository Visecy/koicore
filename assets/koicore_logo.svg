    <circle cx="376.17" cy="162.11" r="2.6" fill="#0F172A" fill-opacity="0.85"/>
    <circle cx="355.68" cy="178.12" r="2.6" fill="#0F172A" fill-opacity="0.85"/>
  </g>

  <!-- Central Hexagonal Kernel ("Core") -->
  <g filter="url(#soft-shadow)">
    <path d="M 243.88 195.00 Q 256.00 188.00, 268.12 195.00 L 302.77 215.00 Q 314.89 222.00, 314.89 236.00 L 314.89 276.00 Q 314.89 290.00, 302.77 297.00 L 268.12 317.00 Q 256.00 324.00, 243.88 317.00 L 209.23 297.00 Q 197.11 290.00, 197.11 276.00 L 197.11 236.00 Q 197.11 222.00, 209.23 215.00 Z" fill="url(#core-hex-fill)" stroke="url(#core-hex-stroke)" stroke-width="3.2"/>
    <path d="M 246.47 204.50 Q 256.00 199.00, 265.53 204.50 L 295.84 222.00 Q 305.36 227.50, 305.36 238.50 L 305.36 273.50 Q 305.36 284.50, 295.84 290.00 L 265.53 307.50 Q 256.00 313.00, 246.47 307.50 L 216.16 290.00 Q 206.64 284.50, 206.64 273.50 L 206.64 238.50 Q 206.64 227.50, 216.16 222.00 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5"/>

    <!-- KoiLang Signature '#' Command Symbol (pure vector geometry, slightly italic) -->
    <g stroke="url(#hash-grad)" stroke-width="10" stroke-linecap="round">
      <line x1="244.5" y1="225" x2="236.5" y2="287"/>
      <line x1="275.5" y1="225" x2="267.5" y2="287"/>
      <line x1="223.5" y1="243.5" x2="290.5" y2="243.5"/>
      <line x1="220.5" y1="268.5" x2="287.5" y2="268.5"/>
    </g>
  </g>
</svg>