<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="koicore logo">
  <defs>
    <!-- Deep ink-navy squircle background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151E32"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080D18"/>
    </linearGradient>

    <!-- Warm radial ambient glow behind the central core -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.30"/>
      <stop offset="52%" stop-color="#F97316" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Koi 1: Vermilion-Coral (Kohaku Red + Rust Energy) -->
    <linearGradient id="koi-vermilion" x1="80%" y1="15%" x2="15%" y2="70%">
      <stop offset="0%" stop-color="#FF8F52"/>
      <stop offset="48%" stop-color="#F04E23"/>
      <stop offset="100%" stop-color="#C81E3A"/>
    </linearGradient>

    <linearGradient id="koi-vermilion-fin" x1="80%" y1="10%" x2="20%" y2="90%">
      <stop offset="0%" stop-color="#FDBA74" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.62"/>
    </linearGradient>

    <!-- Koi 2: Pearl-Ivory (Kohaku White + Crisp Precision) -->
    <linearGradient id="koi-pearl" x1="20%" y1="85%" x2="85%" y2="30%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="koi-pearl-fin" x1="20%" y1="90%" x2="80%" y2="10%">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.52"/>
    </linearGradient>

    <!-- Central Hexagonal Kernel ("Core") -->
    <linearGradient id="core-hex-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>

    <linearGradient id="core-hex-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="45%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.75"/>
    </linearGradient>

    <!-- KoiLang Signature '#' Command Symbol -->
    <linearGradient id="hash-grad" gradientUnits="userSpaceOnUse" x1="218" y1="222" x2="294" y2="290">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="45%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Badge -->
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="url(#bg-grad)"/>
  <rect x="21.5" y="21.5" width="469" height="469" rx="106.5" ry="106.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>

  <!-- Ambient Core Glow -->
  <circle cx="256" cy="256" r="185" fill="url(#core-glow)"/>

  <!-- Subtle Pond Ripples / Streaming Orbits -->
  <circle cx="256" cy="256" r="198" fill="none" stroke="#94A3B8" stroke-opacity="0.10" stroke-width="1.5" stroke-dasharray="12 10"/>
  <circle cx="256" cy="256" r="139" fill="none" stroke="#94A3B8" stroke-opacity="0.08" stroke-width="1.5"/>

