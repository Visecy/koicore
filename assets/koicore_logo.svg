    <path d="M 365.99 156.97 C 363.93 150.53, 356.01 137.43, 347.11 130.60 C 338.20 123.77, 318.67 115.50, 312.57 116.00 C 306.46 116.49, 306.80 127.06, 310.50 133.58 C 314.21 140.11, 326.65 149.19, 334.80 155.13 C 342.96 161.07, 354.22 168.92, 359.42 169.22 C 364.61 169.53, 368.04 163.41, 365.99 156.97 Z" fill="#FFF7ED" fill-opacity="0.22"/>
    <path d="M 334.29 139.93 C 327.00 136.15, 306.91 121.17, 290.59 117.25 C 274.28 113.32, 252.94 113.55, 236.38 116.37 C 219.81 119.19, 204.37 126.74, 191.21 134.15 C 178.06 141.56, 163.08 156.39, 157.45 160.83" fill="none" stroke="#FFEDD5" stroke-opacity="0.52" stroke-width="4" stroke-linecap="round"/>
    <circle cx="376.17" cy="162.11" r="2.6" fill="#0F172A" fill-opacity="0.85"/>
    <circle cx="355.68" cy="178.12" r="2.6" fill="#0F172A" fill-opacity="0.85"/>
  </g>

